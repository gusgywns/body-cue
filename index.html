<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 몸 큐잉 (Gemma 4)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#15233A; --mute:#5D6B7E; --line:#CBD3DC;
  --tape:#F2C230; --tape-ink:#15233A; --hot:#D2452F; --bone:#15233A;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1826; --surface:#172337; --ink:#E7ECF3; --mute:#93A1B5; --line:#2B3B54;
    --tape:#F2C230; --tape-ink:#15233A; --hot:#FF7059; --bone:#E7ECF3;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1826; --surface:#172337; --ink:#E7ECF3; --mute:#93A1B5; --line:#2B3B54;
  --tape:#F2C230; --tape-ink:#15233A; --hot:#FF7059; --bone:#E7ECF3;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;word-break:keep-all;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding:20px 20px 120px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.01em;background:none;border:0;padding:0}
.brand i{display:inline-block;width:26px;height:10px;margin-right:8px;background:var(--tape);
  background-image:repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 5px);vertical-align:middle}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}

h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6.2vw,50px);line-height:1.18;margin:36px 0 14px;letter-spacing:-.01em}
.lede{color:var(--mute);max-width:36em;margin:0 0 34px}
h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,4.6vw,34px);line-height:1.2;margin:30px 0 6px}
h3{font-size:18px;font-weight:600;margin:0 0 4px}

/* 부위 고르기 */
.regions{border-top:1px solid var(--line)}
.region{display:grid;grid-template-columns:150px 1fr;gap:8px 20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.region-name{font-family:var(--display);font-size:clamp(34px,7vw,52px);line-height:1}
.subs{display:flex;flex-wrap:wrap;gap:8px}
.sub{background:var(--surface);border:2px solid var(--ink);padding:9px 14px;font-weight:600;border-radius:2px}
.sub:hover{background:var(--tape);color:var(--tape-ink);border-color:var(--tape-ink)}
@media (max-width:520px){.region{grid-template-columns:1fr}}

.saved{margin-top:40px}
.saved ul{list-style:none;margin:10px 0;padding:0;display:grid;gap:6px}
.saved li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.saved li span:last-child{font-weight:600;white-space:nowrap}
.note{color:var(--mute);font-size:14px}

/* 줄자 진행 표시 */
.ruler{position:relative;height:22px;background:var(--surface);border:2px solid var(--ink);margin:14px 0 26px}
.ruler span{position:absolute;inset:0 auto 0 0;background:var(--tape);
  background-image:repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 8px);transition:width .35s ease}
.ruler b{position:absolute;right:8px;top:-1px;font-size:13px;line-height:20px;font-weight:600}

/* 측정 카드 */
.test{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--ink);padding:20px;margin:0 0 18px}
.test.done{border-left-color:var(--tape)}
.test header p{margin:0 0 14px;color:var(--mute);font-size:15px}
.test-body{display:grid;grid-template-columns:minmax(200px,260px) 1fr;gap:18px;align-items:start}
@media (max-width:600px){.test-body{grid-template-columns:1fr}}
.demo{margin:0;border:1px solid var(--line);background:#101826}
.demo svg{display:block;width:100%;height:auto}
.demo figcaption{padding:7px 10px;font-size:13.5px;font-weight:600;border-top:1px solid var(--line);background:var(--surface)}
.demo .prop{stroke:#44536B;stroke-width:5}
.demo .guide{stroke:#8FA0B8}
.demo .lbl{fill:#B4C0D2}
.demo .bone{stroke:#D3D9E2}
.demo .hot{stroke:#1F8BFF}
.demo .headc{fill:#101826;stroke:#D3D9E2}
.lg{display:block;margin-top:4px;font-weight:400;font-size:13px;color:var(--mute)}
.lg i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px;border-radius:2px}
.lg i.p{background:#1F8BFF}.lg i.s{background:#8CC2FF;margin-left:6px}
.how{margin:0;padding-left:1.3em}
.how li{margin-bottom:8px}
.bone{stroke:var(--bone);stroke-width:5;stroke-linecap:round;fill:none}
.hot{stroke:var(--hot);stroke-width:6;stroke-linecap:round;fill:none}
.headc{fill:var(--bg);stroke:var(--bone);stroke-width:4}
.guide{stroke:var(--mute);stroke-width:1.2;stroke-dasharray:4 4;fill:none}
.prop{stroke:var(--mute);stroke-width:3;fill:none;stroke-linecap:round}
.lbl{fill:var(--mute);font:600 10px var(--body)}
.camg rect,.camg circle{fill:var(--tape);stroke:var(--tape-ink);stroke-width:1.5}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.ruler span{transition:none}}

.upload{margin:18px 0 0;padding-top:16px;border-top:1px dashed var(--line)}
.filebtn{display:inline-block;border:2px solid var(--ink);padding:9px 14px;font-weight:600;background:var(--bg);border-radius:2px;cursor:pointer}
.filebtn:hover{background:var(--tape);color:var(--tape-ink)}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.filebtn:focus-within{outline:3px solid var(--tape);outline-offset:2px}
.status{margin:10px 0 0;font-size:15px}
.status.err{color:var(--hot)}
.clip{margin-top:12px}
.clip video{display:block;width:100%;max-height:340px;background:#000}
.clip .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}

.opts{border:0;margin:18px 0 0;padding:0;display:grid;gap:8px}
.opts legend{padding:0;margin-bottom:8px;font-weight:600}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);padding:10px 14px;display:grid;grid-template-columns:128px 1fr;gap:10px;align-items:baseline;border-radius:2px}
.opt b{font-weight:600}
.opt span{color:var(--mute);font-size:15px}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--tape);border-color:var(--tape-ink);color:var(--tape-ink)}
.opt[aria-pressed="true"] span{color:var(--tape-ink)}
@media (max-width:480px){.opt{grid-template-columns:1fr;gap:2px}}

.primary{background:var(--ink);color:var(--bg);border:2px solid var(--ink);padding:12px 20px;font-weight:600;border-radius:2px}
.primary:hover:not(:disabled){background:var(--tape);color:var(--tape-ink);border-color:var(--tape-ink)}
.primary:disabled{opacity:.4;cursor:not-allowed}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--ink);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:740px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}

/* 결과 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px;padding:0;list-style:none}
.chips li{border:1px solid var(--line);background:var(--surface);padding:5px 10px;font-size:14px}
.chips b{font-weight:600}
.ex{margin-top:30px;border-top:2px solid var(--ink);padding-top:18px}
.kind{display:inline-block;background:var(--tape);color:var(--tape-ink);font-weight:600;font-size:13px;padding:2px 8px;margin-bottom:8px}
.ex h3{font-family:var(--display);font-weight:400;font-size:clamp(24px,5vw,32px);line-height:1.2;margin-bottom:12px}
.cues{list-style:none;counter-reset:c;margin:0;padding:0}
.cues li{counter-increment:c;display:grid;grid-template-columns:34px 1fr;gap:0 10px;padding:14px 0;border-bottom:1px solid var(--line)}
.cues li::before{content:counter(c);font-family:var(--display);font-size:22px;line-height:1.3;color:var(--mute)}
.cues strong{display:block;font-weight:600}
.cues p{margin:2px 0 0}
.cues li.mine{background:linear-gradient(90deg,var(--tape) 0 4px,transparent 4px);padding-left:12px;margin-left:-12px}
.cues .by{display:inline-block;margin-top:6px;font-size:13px;color:var(--mute);border-bottom:2px solid var(--tape)}
.ex h4{font-size:16px;font-weight:600;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.vars{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.var{display:block;text-align:left;background:var(--surface);border:2px solid var(--line);padding:12px 14px;border-radius:2px}
.var:hover{border-color:var(--ink)}
.var.rec{box-shadow:inset 0 5px 0 var(--tape)}
.var[aria-pressed="true"]{border-color:var(--ink);background:var(--bg);box-shadow:inset 6px 0 0 var(--tape)}
.var strong{display:block;font-weight:600;margin-bottom:2px}
.var .pc{display:block;margin-top:8px;font-size:15px}
.var .pc b{display:inline-block;font-weight:600;font-size:13px;margin-right:6px;padding:0 6px;border:1px solid var(--line);color:var(--mute)}
.var .by{display:inline-block;font-size:13px;color:var(--mute);border-bottom:2px solid var(--tape)}
.sel{margin-top:12px;padding:16px;background:var(--surface);border:2px solid var(--ink)}
.views{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.views{grid-template-columns:1fr}}
.sel .lg{margin:8px 0 0}
.selq{margin-top:14px}
.selq>strong{display:block;font-weight:600;margin-bottom:8px}
.mark{fill:var(--tape);stroke:var(--tape-ink);stroke-width:1.5}
.joints{margin:0}
.joints div{display:grid;grid-template-columns:128px 1fr;gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line)}
.joints dt{font-weight:600}
.joints dd{margin:0}
@media (max-width:520px){.joints div{grid-template-columns:1fr}}
.ex>.note{margin:10px 0 0}
.custom{margin-top:44px;padding:20px;background:var(--surface);border:1px solid var(--line)}
.custom .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.custom select{padding:11px 12px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:2px;font:inherit}
.custom input{flex:1 1 220px;min-width:0;padding:11px 12px;border:2px solid var(--ink);background:var(--bg);border-radius:2px}
.back{margin-top:22px}
.chat{margin-top:18px}
.log{display:grid;gap:10px;margin-top:14px}
.log:empty{display:none}
.msg{padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:92%;border-radius:2px}
.msg.user{justify-self:end;background:var(--tape);color:var(--tape-ink);font-weight:500}
.msg.assistant{justify-self:start;background:var(--bg);border-left:4px solid var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="brand" data-act="home"><i></i>내 몸 큐잉</button>
    <button class="linkbtn" data-act="home">부위 다시 고르기</button>
  </div>
  <main id="app"></main>
</div>

    m:[['lat','M2.5,22C9,14 16,11 22,12.5C23,20 20,30 17,38C13,46 8,50 2.5,52Z',1],['erector','M-2.6,30L2.6,30L3.2,56L-3.2,56Z'],
       ['trap','M0,-7C6,-2 14,1 21,5C14,8 6,13 0,27C-6,13-14,8-21,5C-14,1-6,-2 0,-7Z'],['glute','M1,57C8,55 16,58 16.6,64C15,70 6,71 1,69Z',1]]},

  shin:{base:B_SN,post:SH.front.shin.post,m:[['calf','M-4.5,1C-7,7-6,16-3,24L3,24C5,16 6,7 4.5,1Z']]}

const SEGS={
  side:[['thigh','hip','knee2',36,1,.72],['shin','knee2','ankle2',36,1,.72],['thigh','hip','knee',36],['shin','knee','ankle',36],['foot','ankle','toe',17],['torso','sh','hip',54],['head','head','sh',22],['ua','sh','elbow',28],['fa','elbow','hand',26]],
  front:[['thigh','hipL','knL',36,-1],['shin','knL','anL',34,-1],['thigh','hipR','knR',36,1],['shin','knR','anR',34,1],['torso','neck','pelvis',58],['head','head',null,0],['ua','shL','elL',28,-1],['fa','elL','haL',26,-1],['ua','shR','elR',28,1],['fa','elR','haR',26,1]]
};
function segTf(J,s){

function toJpeg(src,w,h){
  const k=Math.min(1,1280/Math.max(w,h)),c=document.createElement('canvas');
  c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',0.85));
}
function fileToJpeg(file){
  return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{toJpeg(im,im.naturalWidth,im.naturalHeight).then(res,rej).finally(()=>URL.revokeObjectURL(url))};
    im.onerror=()=>{URL.revokeObjectURL(url);rej({code:'image_rejected'})};im.src=url});
}
async function analyze(id,blob){
  const t=T[id];
  setStatus(id,'사진을 보고 판정하는 중입니다…');
  const prompt=`당신은 운동 지도를 위한 체형·가동범위 평가 보조자입니다. 첨부한 사진 한 장은 사용자가 "${t.name}" 측정을 위해 찍은 것입니다.
촬영 지침: ${t.how.join(' ')}
${t.cam}
판정 단계:
${Object.keys(t.opts).map(k=>`- ${k}: ${t.opts[k]}`).join('\n')}
보는 법: ${t.ai}
사진이 지침과 다르거나 필요한 관절이 가려져 판정하기 어려우면 usable을 false로 답하세요. 의학적 진단은 하지 않습니다.
JSON만 답하세요: {"usable":true 또는 false,"value":${Object.keys(t.opts).map(k=>`"${k}"`).join(' 또는 ')} 또는 null,"estimate":"관찰한 각도·거리·비율과 근거를 한국어 한 문장으로","retake":"usable이 false일 때 다시 찍는 방법을 한국어 한 문장으로"}`;
  try{
    const r=await AI.fn.json(prompt,{images:[blob]});
    if(r&&r.usable&&t.opts[r.value]){
      S.m[id]={v:r.value,src:'ai'};save();
      UI[id]=Object.assign(UI[id]||{},{msg:`판정: ${t.tag[r.value]}. ${r.estimate||''} 다르다고 느끼면 아래에서 직접 바꾸세요.`,err:false});
      refreshCard(id);
    }else setStatus(id,`이 사진으로는 판정하기 어렵습니다. ${(r&&r.retake)||'영상 안내대로 다시 찍어 주세요.'}`,true);
  }catch(e){setStatus(id,errMsg(e),true)}
}
document.addEventListener('change',async e=>{
  const inp=e.target.closest('input[data-file]'); if(!inp||!inp.files[0]) return;
  const id=inp.dataset.file,f=inp.files[0];
  if(f.type.startsWith('video/')){
    if(UI[id]&&UI[id].video) URL.revokeObjectURL(UI[id].video);
    UI[id]={video:URL.createObjectURL(f),msg:'',err:false};refreshCard(id);
  }else{
    try{const b=await fileToJpeg(f);await analyze(id,b)}catch(err){setStatus(id,errMsg(err.code?err:{code:'image_rejected'}),true)}
  }
});

측정 결과:
${meas}
규칙:
- vars: 이 운동의 종류·그립 선택지 2–4개(예: 오버그립, 뉴트럴 그립, 언더그립, 손잡이·기구 차이)와 각각의 장점·단점 한 문장씩. 이 사람의 측정 결과에 가장 맞는 것 하나를 첫 번째에 두고 이름 끝에 "(추천)"을 붙입니다.

      c.cues=list;
      c.traits=(Array.isArray(r.traits)?r.traits:[]).filter(x=>x&&x.text).map(toCue);
      c.vars=(Array.isArray(r.vars)?r.vars:[]).filter(v=>v&&v.n).map(v=>({n:String(v.n),pro:String(v.pro||''),con:String(v.con||''),q:(Array.isArray(v.q)?v.q:[]).map(String).slice(0,5)}));
      c.joints=(Array.isArray(r.joints)?r.joints:[]).filter(j=>Array.isArray(j)&&j.length>1).map(j=>[String(j[0]),String(j[1])]);
      render();
    }
  }catch(e){if(S.custom===c){c.err=e&&e.code==='rate_limited'?ERR.rate_limited:e&&e.code==='not_granted'?ERR.not_granted:e&&e.code==='busy'?ERR.busy:'큐를 만들지 못했습니다. 다시 시도해 주세요.';c.err+=det(e);render()}}
}

/* ───────── 질문 채팅(Gemma 4) ───────── */
S.chat=[];
let chatBusy=false;
function chatHtml(){
  return `<section class="custom chat"><h3>운동하다 생긴 궁금증 물어보기</h3><p class="note" style="margin:0">저장된 내 측정값을 참고해서 답합니다. 예: 덤벨프레스를 하는데 손목이 불안해요. 어떻게 해야 하나요?</p>
    <div class="log" id="log" aria-live="polite">${S.chat.map(t=>`<div class="msg ${t.role}">${esc(t.content)}</div>`).join('')}${chatBusy?'<div class="msg assistant" id="live">생각하는 중…</div>':''}</div>
    <div class="row"><input id="cq" type="text" maxlength="400" placeholder="질문을 적으세요" aria-label="질문"><button class="primary" data-act="chat">질문 보내기</button></div><p class="status" id="cqs" role="status"></p></section>`;
}
async function sendChat(){
  const inp=document.getElementById('cq'),q=inp?(inp.value||'').trim():'';
  if(!q||chatBusy||!AI.fn) return;
  chatBusy=true;inp.value='';
  S.chat.push({role:'user',content:q});
  const log=document.getElementById('log');
  if(log) log.insertAdjacentHTML('beforeend',`<div class="msg user">${esc(q)}</div><div class="msg assistant" id="live">생각하는 중…</div>`);
  const st0=document.getElementById('cqs'); if(st0){st0.textContent='';st0.className='status'}
  const ids=Object.keys(S.m).filter(k=>T[k]);
  const exNames=S.custom?S.custom.name:(S.part?PARTS[S.part].ex.map(k=>EX[k].name).join(', '):'');
  const rules=`당신은 해부학과 운동역학에 밝은 근비대 코치입니다. 아래 사용자의 질문에 한국어로 답하세요.
규칙:
- 웨이트 트레이닝, 자세, 큐, 프로그램, 장비에 관한 질문에만 답합니다. 그 밖의 주제는 운동 질문을 해 달라고 한 문장으로 안내합니다.
- 먼저 가장 가능성 높은 원인을 한 문장으로 짚고, 바로 따라 할 수 있는 수정 큐를 2–4개 줍니다. 각도, cm, 몸의 기준점처럼 구체적으로 씁니다.
- 아래 측정값이 답에 영향을 주면 그 점을 반영하고 어떤 측정 때문인지 말합니다. 관련 없으면 언급하지 않습니다.
- 통증, 저림, 부기, 다친 뒤의 증상은 진단하지 말고, 그 동작을 멈추고 진료를 받으라고 짧게 권합니다.
- 마크다운 기호(*, #, 표)를 쓰지 말고 평범한 문장과 줄바꿈만 씁니다. 전체 6문장 안팎으로 짧게 답합니다.
사용자 상황:
- 지금 보고 있는 부위: ${S.part?PARTS[S.part].name:'없음'}
- 지금 보고 있는 운동: ${exNames||'없음'}
- 측정값:
${ids.length?ids.map(id=>`  ${T[id].name}: ${T[id].tag[lv(id)]} (${T[id].opts[lv(id)]})`).join('\n'):'  아직 없음'}`;
  let errText='';
  try{
    const r=await AI.fn([{role:'user',content:rules},...S.chat.slice(-11)],{cache:false,onText:({text})=>{const b=document.getElementById('live');if(b&&text)b.textContent=text}});
    S.chat.push({role:'assistant',content:r.text});
  }catch(e){
    S.chat.pop();
    errText=e&&e.code==='rate_limited'?ERR.rate_limited:e&&e.code==='not_granted'?ERR.not_granted:e&&e.code==='busy'?ERR.busy:'답을 받지 못했습니다. 다시 보내 주세요.';errText+=det(e);
  }
  chatBusy=false;
  const lg=document.getElementById('log');
  if(lg) lg.innerHTML=S.chat.map(t=>`<div class="msg ${t.role}">${esc(t.content)}</div>`).join('');
  if(errText){const st=document.getElementById('cqs'),i2=document.getElementById('cq');if(st){st.textContent=errText;st.className='status err'}if(i2&&!i2.value)i2.value=q}
}

/* ───────── 동작 ───────── */
const ACT={
  home(){S.custom=null;go('home')},
  part(d){for(const k in SEL) delete SEL[k];S.part=d.id;S.custom=null;S.tests=PARTS[d.id].tests.slice();go('measure')},
  set(d){S.m[d.id]={v:d.lv,src:'manual'};save();if(UI[d.id]){UI[d.id].msg='';UI[d.id].err=false}refreshCard(d.id)},
  async frame(d){
    const v=document.querySelector('#t-'+d.id+' video'); if(!v||!v.videoWidth){setStatus(d.id,'영상을 불러오지 못했습니다. 다른 파일로 올려 주세요.',true);return}
    v.pause();
    try{const b=await toJpeg(v,v.videoWidth,v.videoHeight);await analyze(d.id,b)}catch(e){setStatus(d.id,errMsg(e),true)}
  },
  result(){go('result');if(S.custom&&!S.custom.cues) writeCues()},
  retrycues(){writeCues()},

};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&ACT[b.dataset.act]) ACT[b.dataset.act](b.dataset)});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing) return;if(e.target.id==='cx') ACT.custom();else if(e.target.id==='cq') ACT.chat()});

/* ───────── Gemma 4 연결 ─────────
   PROXY_URL을 채우면 방문자는 키 없이 쓸 수 있습니다(키는 중계 서버에만 둡니다).
   비워 두면 첫 화면의 “AI 설정”에 입력한 키로 Google API를 직접 부릅니다. */
const PROXY_URL='';
const GKEY='bodycue.gemma.key',GMODEL='bodycue.gemma.model',MODELS=['gemma-4-31b-it','gemma-4-26b-a4b-it'];
const cfg={get key(){try{return localStorage.getItem(GKEY)||''}catch(e){return ''}},get model(){try{const m=localStorage.getItem(GMODEL);return MODELS.includes(m)?m:MODELS[0]}catch(e){return MODELS[0]}}};
const b64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej({code:'image_rejected'});r.readAsDataURL(blob)});
async function gemmaCall(model,body){
  if(PROXY_URL) return fetch(PROXY_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,body})});
  if(!cfg.key) throw {code:'not_granted',message:'키 없음'};
  return fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':cfg.key},body:JSON.stringify(body)});
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function gemma(contents,think){
  /* Google의 Gemma 4 서버는 500 오류를 자주 돌려주므로, 설정과 모델을 바꿔 가며 쉬었다가 여러 번 다시 시도한다 */
  const other=MODELS.find(m=>m!==cfg.model),plain={contents},thk={contents,generationConfig:{thinkingConfig:{thinkingLevel:think?'high':'minimal'}}};
  const tries=[[cfg.model,thk,0],[cfg.model,plain,0],[other,plain,0],[cfg.model,plain,3000],[other,plain,0],[cfg.model,plain,7000],[other,plain,0]];
  const errs=[],t0=Date.now();
  for(const [model,body,pause] of tries){
    if(pause){if(Date.now()-t0>80000) break;await wait(pause)}
    let r;
    try{r=await gemmaCall(model,body)}catch(e){throw e&&e.code?e:{code:'network',message:'요청이 차단됐거나 주소가 틀림: '+(PROXY_URL||'Google API')+' / '+(e&&e.message||'')}}
    let raw='';try{raw=await r.text()}catch(e){}
    let d=null;try{d=JSON.parse(raw)}catch(e){}
    const msg=(d&&d.error&&(d.error.message||d.error.status))||raw.slice(0,120);
    if(r.status===429) throw {code:'rate_limited',message:'429 '+msg};
    if(r.status===401||r.status===403||/API key/i.test(msg)) throw {code:'not_granted',message:r.status+' '+msg};
    if(!r.ok){errs.push(r.status+' '+model.replace('gemma-4-','')+(body===thk?'(생각 설정)':'')+': '+String(msg).slice(0,70));continue}
    const parts=d&&d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts||[];
    const text=parts.filter(p=>p&&!p.thought&&typeof p.text==='string').map(p=>p.text).join('').trim();
    if(text) return text;
    errs.push('글 없는 응답 '+model.replace('gemma-4-','')+': '+raw.slice(0,70));
  }
  const all500=errs.length&&errs.every(x=>x.startsWith('500')||x.startsWith('503'));
  throw {code:all500?'busy':'failed',message:errs.length+'번 시도 — '+[...new Set(errs)].join(' | ')};
}
AI.fn=async function(input,opts){
  const turns=typeof input==='string'?[{role:'user',content:input}]:input;
  const text=await gemma(turns.map(t=>({role:t.role==='assistant'?'model':'user',parts:[{text:t.content}]})),false);
  if(opts&&opts.onText) opts.onText({text});
  return {text};
};
AI.fn.json=async function(prompt,opts){
  const parts=[];
  for(const im of (opts&&opts.images)||[]) parts.push({inline_data:{mime_type:im.type||'image/jpeg',data:await b64(im)}});
  parts.push({text:prompt});
  const t=(await gemma([{role:'user',parts}],true)).replace(/```json|```/g,'');
  const i=t.indexOf('{'),j=t.lastIndexOf('}');
  if(i<0||j<=i) throw {code:'failed'};
  try{return JSON.parse(t.slice(i,j+1))}catch(e){throw {code:'failed'}}
};
AI.img=true;
ACT.savekey=()=>{const k=document.getElementById('gk'),m=document.getElementById('gm'),st=document.getElementById('gs');
  try{if(k&&k.value.trim())localStorage.setItem(GKEY,k.value.trim());if(m)localStorage.setItem(GMODEL,m.value)}catch(e){}
  if(st){st.className='status';st.textContent='연결을 확인하는 중입니다…'}
  AI.fn('"연결됨"이라고만 답하세요.').then(()=>{const s2=document.getElementById('gs');if(s2){s2.className='status';s2.textContent='Gemma 4에 연결됐습니다.'}},e=>{const s2=document.getElementById('gs');if(s2){s2.className='status err';s2.textContent=errMsg(e)}});
};
ACT.delkey=()=>{try{localStorage.removeItem(GKEY)}catch(e){}render()};
render();
</script>
